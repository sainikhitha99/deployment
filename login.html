<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – AI powered DBA assistant</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #0078d4 0%,
          #5c2d91 60%,
          #e044a7 100%
        );
      }
      .login-card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        padding: 48px 42px;
        text-align: center;
        max-width: 420px;
        width: 100%;
      }
      .login-card svg.brand-icon {
        width: 72px;
        height: 72px;
        margin-bottom: 14px;
      }
      .login-card h1 {
        font-size: 1.8rem;
        margin-bottom: 4px;
        color: #1a1a1a;
        letter-spacing: 4px;
        font-weight: 800;
      }
      .login-card .subtitle {
        font-size: 0.78rem;
        color: #999;
        margin-bottom: 18px;
        letter-spacing: 0.3px;
      }
      .login-card p {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 28px;
      }
      .btn-microsoft {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #0078d4;
        color: #fff;
        padding: 12px 32px;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-microsoft:hover {
        background: #005fa3;
      }
      .btn-microsoft[aria-disabled="true"] {
        opacity: 0.6;
        pointer-events: none;
        cursor: default;
      }
      .btn-microsoft svg {
        width: 20px;
        height: 20px;
        fill: #fff;
        margin-bottom: 0;
      }
      .flash {
        margin-bottom: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 0.95rem;
      }
      .flash-danger {
        background: #fdecea;
        color: #611a15;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <svg
        class="brand-icon"
        viewBox="0 0 64 64"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="meteorGrad1" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e044a7" stop-opacity="0" />
            <stop offset="100%" stop-color="#e044a7" />
          </linearGradient>
          <linearGradient id="meteorGrad2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5c2d91" stop-opacity="0" />
            <stop offset="100%" stop-color="#0078d4" />
          </linearGradient>
          <linearGradient id="meteorGrad3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0078d4" />
            <stop offset="100%" stop-color="#e044a7" />
          </linearGradient>
        </defs>
        <!-- Tails -->
        <path
          d="M 60 10 Q 40 10 18 36"
          fill="none"
          stroke="url(#meteorGrad1)"
          stroke-width="4"
          stroke-linecap="round"
        />
        <path
          d="M 64 16 Q 42 16 22 42"
          fill="none"
          stroke="url(#meteorGrad2)"
          stroke-width="7"
          stroke-linecap="round"
        />
        <path
          d="M 54 4 Q 35 15 15 32"
          fill="none"
          stroke="url(#meteorGrad1)"
          stroke-width="2"
          stroke-linecap="round"
        />
        <!-- Trailing sparks -->
        <circle cx="48" cy="14" r="1.5" fill="#e044a7" opacity="0.8" />
        <circle cx="38" cy="24" r="2" fill="#5c2d91" opacity="0.6" />
        <circle cx="28" cy="18" r="1" fill="#0078d4" opacity="0.9" />
        <circle cx="56" cy="24" r="1.5" fill="#e044a7" opacity="0.5" />
        <!-- Star body -->
        <circle cx="20" cy="40" r="10" fill="url(#meteorGrad3)" />
        <circle cx="20" cy="40" r="4" fill="#fff" />
      </svg>
      <h1>AI powered DBA assistant</h1>
      <div class="subtitle">
       	Intelligent multi-database performance analysis and recommendations
      </div>
      {% if flash_messages %}
        {% for category, msg in flash_messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
      <a
        class="btn-microsoft"
        href="{{ auth_url or '#' }}"
        {%
        if
        not
        auth_url
        %}aria-disabled="true"
        {%
        endif
        %}
      >
        <svg viewBox="0 0 21 21">
          <rect x="1" y="1" width="9" height="9" fill="#f25022" />
          <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
          <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
        </svg>
        Sign in with Microsoft
      </a>
    </div>
  </body>
</html>
